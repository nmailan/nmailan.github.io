title: "Fancy Jungle"
id: fj
author: by Katie Đỗ / <i>dir. Shyama Nithiananda</i>
director: Shyama Nithiananda
detail: Wagner New Play Festival
role: <b>Role:</b> Lucy
style: "style2 medium lightbox onscroll-fade-in"
content: "<i>Fancy Jungle</i> is a contemporary play written by Katie Đỗ that debuted in May 2026 at the Wagner New Play Festival. 
    It centers on Margo Ho, a Gen Z Vietnamese-American playwright, and Lucy, a Chinese-American showrunner, 
    as they clash over authenticity and representation in a TV writers' room."


